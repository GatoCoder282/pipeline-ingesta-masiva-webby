name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
