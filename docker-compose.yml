name: webby-ingestion

services:
  postgres:
    image: postgres:17-alpine
    container_name: webby-ingestion-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingestion_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-kestra}
    ports:
      - "55432:5432"
    volumes:
      - ingestion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ingestion} -d ${POSTGRES_DB:-kestra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kestra:
    build:
      context: .
      dockerfile: Dockerfile.kestra
    container_name: webby-ingestion-kestra
    user: "root"
    command: server standalone --config /etc/kestra/application.yml
    ports:
      - "8080:8080"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kestra}
            driver-class-name: org.postgresql.Driver
            username: ${POSTGRES_USER:-ingestion}
            password: ${POSTGRES_PASSWORD:-ingestion_dev_only}
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          server:
            basic-auth:
              enabled: false
          url: http://localhost:8080/
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
        micronaut:
          io:
            watch:
              enabled: true
              paths:
                - /flows
    volumes:
      - kestra_storage:/app/storage
      - ./kestra/flows:/flows
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    profiles: ["integrations"]
    image: n8nio/n8n:latest
    container_name: webby-ingestion-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-this-local-key}
      GENERIC_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows

  pipeline:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/ingestion-venv
      INGESTION_DATA_DIR: /workspace/data
    volumes:
      - ./:/workspace
    entrypoint: ["uv", "run", "ingestion"]

volumes:
  ingestion_postgres_data:
  kestra_storage:
  n8n_data:
