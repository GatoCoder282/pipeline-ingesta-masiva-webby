[project]
name = "webby-ingestion-pipeline"
version = "0.1.0"
description = "Local, reproducible ingestion pipeline for Webby catalog migrations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "pymupdf>=1.26,<2",
  "pytesseract>=0.3.13,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
ingestion = "ingestion_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
